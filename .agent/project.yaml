  frameworks: []
  package_managers: []
  infrastructure_as_code: null

ai:
  enabled: false
  provider: null
  deployment: null
  model: null
  secrets_location: null

commands:
  bootstrap: null
  lint: null
  test: null
  build: null
  validate: null
  provision_temp: null
  deploy: null
  health_check: null
  rollback: null
  destroy_temp: null

